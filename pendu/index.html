<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../auth.js"></script>
  <title>Le Jeu du Pendu</title>
  <style>
    :root {
      --rs-green: #3CD200;
      --rs-green-dark: #2E9E00;
      --rs-blue: #1D096E;
      --rs-blue-light: #4A3AA0;
      --bg: #f5f7fa;
      --card: #ffffff;
      --muted: #5b5675;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--rs-blue);
      font-family: Wotfard, Arial, sans-serif;
      padding: 24px 16px 48px;
    }
    .back {
      display: inline-block;
      margin: 0 auto 16px;
      color: var(--rs-blue);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { text-decoration: underline; }
    .wrap { max-width: 560px; margin: 0 auto; }
    main {
      background: var(--card);
      border-top: 6px solid var(--rs-green);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(29, 9, 110, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
    svg { width: 200px; height: 190px; }
    .gallows { stroke: var(--rs-blue); stroke-width: 5; stroke-linecap: round; fill: none; }
    .part { stroke: var(--rs-green-dark); stroke-width: 5; stroke-linecap: round; fill: none; }
    .hidden { display: none; }
    #word {
      font-size: 2rem;
      letter-spacing: 6px;
      font-weight: 700;
      margin: 8px 0 4px;
      min-height: 2.6rem;
      word-break: break-word;
    }
    #status { min-height: 1.5rem; margin: 4px 0 16px; font-weight: 700; }
    #status.win { color: var(--rs-green-dark); }
    #lives { color: var(--muted); font-size: 0.9rem; margin: 0 0 12px; }
    #keys {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      gap: 6px;
      margin-bottom: 20px;
    }
    #keys button {
      background: var(--rs-blue);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 0;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
    }
    #keys button:hover:not(:disabled) { background: var(--rs-blue-light); }
    #keys button.ok { background: var(--rs-green); color: var(--rs-blue); font-weight: 700; }
    #keys button.ko { background: #d9d6e6; color: #8b86a3; text-decoration: line-through; }
    #keys button:disabled { cursor: default; }
    .primary {
      background: var(--rs-green);
      color: var(--rs-blue);
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary:hover { background: var(--rs-blue); color: #fff; }
    .secondary {
      background: #fff;
      color: var(--rs-blue);
      border: 2px solid var(--rs-blue);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
    }
    .secondary:hover { background: var(--rs-blue); color: #fff; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #custom {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e3e1ee;
    }
    #custom p { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
    #custom .row { display: flex; gap: 8px; justify-content: center; }
    #custom input {
      flex: 1;
      max-width: 260px;
      padding: 10px 12px;
      border: 2px solid var(--rs-blue);
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--rs-blue);
    }
    #custom-error { min-height: 1.2rem; margin: 8px 0 0; color: #b3261e; font-size: 0.9rem; }
    button:focus-visible { outline: 3px solid var(--rs-green); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">&larr; Retour aux projets</a>
    <main>
      <h1>Le Jeu du Pendu</h1>
      <p class="sub">Retrouvez le mot avant que le volet ne se bloque.</p>

      <svg viewBox="0 0 200 190" role="img" aria-label="Dessin du pendu">
        <line class="gallows" x1="20" y1="180" x2="120" y2="180"/>
        <line class="gallows" x1="50" y1="180" x2="50" y2="15"/>
        <line class="gallows" x1="50" y1="15" x2="140" y2="15"/>
        <line class="gallows" x1="140" y1="15" x2="140" y2="40"/>
        <circle class="part" cx="140" cy="55" r="15"/>
        <line class="part" x1="140" y1="70" x2="140" y2="120"/>
        <line class="part" x1="140" y1="82" x2="118" y2="104"/>
        <line class="part" x1="140" y1="82" x2="162" y2="104"/>
        <line class="part" x1="140" y1="120" x2="120" y2="152"/>
        <line class="part" x1="140" y1="120" x2="160" y2="152"/>
      </svg>

      <p id="lives"></p>
      <div id="word" aria-live="polite"></div>
      <div id="status" role="status"></div>
      <div id="keys" aria-label="Clavier"></div>
      <div class="actions">
        <button class="primary" id="new" type="button">Nouvelle partie</button>
        <button class="secondary" id="choose" type="button" aria-expanded="false" aria-controls="custom">Choisir mon mot</button>
      </div>

      <div id="custom" hidden>
        <p>Un joueur saisit un mot (il reste masqué), l'autre le devine.</p>
        <div class="row">
          <input id="custom-word" type="password" maxlength="20" placeholder="Votre mot" aria-label="Mot à deviner" autocomplete="off">
          <button class="primary" id="custom-ok" type="button">Valider</button>
        </div>
        <p id="custom-error" role="alert"></p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var WORDS = [
        "VOLET", "STORE", "LAME", "MOTEUR", "TABLIER", "COFFRE", "COULISSE",
        "ENROULEUR", "TELECOMMANDE", "FRANCHISE", "DEPANNAGE", "REPARATION",
        "PLANNING", "TECHNICIEN", "TREUIL", "SANGLE", "BANNE", "PERSIENNE",
        "BLOCAGE", "PORTE", "GARAGE", "FACADE", "AUTOMATISME", "ROULANT"
      ];
      var MAX = 6;
      var word, guessed, wrong;
      var wordEl = document.getElementById("word");
      var statusEl = document.getElementById("status");
      var livesEl = document.getElementById("lives");
      var keysEl = document.getElementById("keys");
      var parts = Array.prototype.slice.call(document.querySelectorAll(".part"));

      function buildKeyboard() {
        keysEl.innerHTML = "";
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function (l) {
          var b = document.createElement("button");
          b.type = "button";
          b.textContent = l;
          b.dataset.l = l;
          b.addEventListener("click", function () { guess(l); });
          keysEl.appendChild(b);
        });
      }

      function state() {
        var won = word.split("").every(function (c) { return guessed.has(c); });
        var lost = wrong >= MAX;
        return { won: won, lost: lost, over: won || lost };
      }

      function render() {
        var s = state();
        wordEl.textContent = word.split("").map(function (c) {
          return (guessed.has(c) || s.lost) ? c : "_";
        }).join(" ");
        parts.forEach(function (p, i) { p.classList.toggle("hidden", i >= wrong); });
        livesEl.textContent = "Erreurs : " + wrong + " / " + MAX;
        Array.prototype.forEach.call(keysEl.children, function (b) {
          var l = b.dataset.l;
          var used = guessed.has(l);
          b.disabled = used || s.over;
          b.classList.toggle("ok", used && word.indexOf(l) !== -1);
          b.classList.toggle("ko", used && word.indexOf(l) === -1);
        });
        statusEl.className = s.won ? "win" : "";
        if (s.won) statusEl.textContent = "Bravo, volet débloqué !";
        else if (s.lost) statusEl.textContent = "Volet bloqué. Le mot était : " + word;
        else statusEl.textContent = "";
      }

      function guess(l) {
        if (state().over || guessed.has(l)) return;
        guessed.add(l);
        if (word.indexOf(l) === -1) wrong += 1;
        render();
      }

      function newGame(customWord) {
        word = customWord || WORDS[Math.floor(Math.random() * WORDS.length)];
        guessed = new Set();
        wrong = 0;
        buildKeyboard();
        render();
      }

      var customForm = document.getElementById("custom");
      var customInput = document.getElementById("custom-word");
      var customError = document.getElementById("custom-error");
      var chooseBtn = document.getElementById("choose");

      function closeCustom() {
        customForm.hidden = true;
        chooseBtn.setAttribute("aria-expanded", "false");
        customInput.value = "";
        customError.textContent = "";
      }

      document.getElementById("new").addEventListener("click", function () {
        closeCustom();
        newGame();
      });

      chooseBtn.addEventListener("click", function () {
        var open = customForm.hidden;
        customForm.hidden = !open;
        chooseBtn.setAttribute("aria-expanded", String(open));
        if (open) customInput.focus(); else closeCustom();
      });

      customInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); validateCustom(); }
      });
      document.getElementById("custom-ok").addEventListener("click", validateCustom);

      function validateCustom() {
        var w = customInput.value.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().trim();
        if (!/^[A-Z]+$/.test(w)) {
          customError.textContent = "Utilisez uniquement des lettres, sans espace ni chiffre.";
          return;
        }
        if (w.length < 3) {
          customError.textContent = "Le mot doit contenir au moins 3 lettres.";
          return;
        }
        closeCustom();
        newGame(w);
      }

      document.addEventListener("keydown", function (e) {
        if (e.target && e.target.tagName === "INPUT") return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        var k = e.key.normalize("NFD").replace(/[̀-ͯ]/g, "");
        if (/^[a-zA-Z]$/.test(k)) guess(k.toUpperCase());
      });

      newGame();
    })();
  </script>
</body>
</html>
