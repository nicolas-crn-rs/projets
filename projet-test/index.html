<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../auth.js"></script>
  <title>Page de test</title>
  <style>
    :root {
      --rs-green: #3CD200;
      --rs-blue: #1D096E;
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1D096E;
      --muted: #5b5675;
      --accent: #1D096E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: Wotfard, Arial, sans-serif;
      padding: 16px;
    }
    .wrap { max-width: 520px; width: 100%; }
    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--rs-blue);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { text-decoration: underline; }
    main {
      background: var(--card);
      max-width: 520px;
      width: 100%;
      padding: 40px 32px;
      border-radius: 12px;
      border-top: 6px solid var(--rs-green);
      box-shadow: 0 4px 24px rgba(29, 9, 110, 0.12);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.75rem; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--rs-green); color: var(--rs-blue); }
    #date { margin-top: 24px; font-size: 0.875rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../">&larr; Retour aux projets</a>
    <main>
      <h1>Page de test</h1>
      <p>Si vous lisez ce message, la mise en ligne a fonctionné.</p>
      <button id="btn" type="button">Cliquer pour tester</button>
      <div id="date"></div>
    </main>
  </div>
  <script>
    var COLORS = ["#3CD200", "#1D096E", "#2E9E00", "#4A3AA0", "#9BE87F"];

    function confetti(x, y) {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var canvas = document.createElement("canvas");
      canvas.setAttribute("aria-hidden", "true");
      canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999";
      var dpr = window.devicePixelRatio || 1;
      var W = window.innerWidth, H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      document.body.appendChild(canvas);
      var ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      var pieces = [];
      for (var i = 0; i < 140; i++) {
        var angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
        var speed = 6 + Math.random() * 9;
        pieces.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 6 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.4,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          round: Math.random() < 0.3
        });
      }

      var DURATION = 2800;
      var start = null;

      function frame(t) {
        if (start === null) start = t;
        var elapsed = t - start;
        ctx.clearRect(0, 0, W, H);
        var fade = elapsed > DURATION - 700 ? Math.max(0, (DURATION - elapsed) / 700) : 1;
        pieces.forEach(function (p) {
          p.vy += 0.32;
          p.vx *= 0.99;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.globalAlpha = fade;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          if (p.round) {
            ctx.beginPath();
            ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          }
          ctx.restore();
        });
        if (elapsed < DURATION) {
          requestAnimationFrame(frame);
        } else if (canvas.parentNode) {
          canvas.parentNode.removeChild(canvas);
        }
      }
      requestAnimationFrame(frame);
    }

    document.getElementById("btn").addEventListener("click", function (e) {
      document.getElementById("date").textContent =
        "Test réussi le " + new Date().toLocaleString("fr-FR");
      var r = e.currentTarget.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2);
    });
  </script>
</body>
</html>
